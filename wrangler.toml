# Cloudflare deployment for Aspect Calc.
#
# A static-assets-only Worker: no server code. The fleet does NOT use Cloudflare
# Pages — `pages_build_output_dir` fails here with "Could not detect a directory
# containing static files", which reads like a missing build step and is really
# the wrong config key. Same shape as blend-calc and pixel-peeker.
#
# Deploys are automatic: .github/workflows/deploy.yml runs `wrangler deploy` on
# every push to main that touches something a visitor sees. `cf-run npx wrangler
# deploy` is the fallback when Actions is down.
#
# Cloudflare does NOT build this one, and never did — an earlier version of this
# comment said it did, and eight commits sat undeployed for sixteen days behind
# that claim. It is plain Vite and the real tool rather than a recording, so
# there is nothing to capture ahead of time and dist/ stays out of git; the
# workflow builds it. Do not connect a Cloudflare dashboard build.
#
# `public/_headers` is copied into dist/ by Vite and carries the CSP and the
# immutable-cache rule for hashed assets; the assets runtime honours it.
#
# `name` must match the Cloudflare project.

name = "aspect-calc"
compatibility_date = "2026-07-30"

[assets]
directory = "./dist"
